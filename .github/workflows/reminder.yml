name: 减脂提醒

# 单文件版：所有逻辑都在这一个文件里，不需要额外的 .py 文件。
# 创建方式：仓库 → Add file → Create new file → 路径填 .github/workflows/remind.yml
#          → 粘贴本文件全部内容 → Commit changes

on:
  schedule:
    - cron: "37 2 * * *"
    - cron: "7 8 * * *"
  workflow_dispatch:
    inputs:
      meal:
        description: "dinner 或 lunch"
        required: true
        default: dinner
        type: choice
        options:
          - dinner
          - lunch

permissions:
  contents: write

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 生成并推送到微信
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MEAL: ${{ inputs.meal }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then MEAL="$INPUT_MEAL";
          elif [ "$SCHEDULE" = "7 8 * * *" ]; then MEAL=dinner;
          else MEAL=lunch; fi
          export MEAL
          echo "本次餐次：$MEAL"
          python3 - <<'PYEOF'
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          """减脂提醒 · 精简版。这份代码会被原样缩进嵌入 GitHub Actions workflow。

          用法：MEAL=dinner python3 remind_lite.py
          环境变量：MEAL / SENDKEY / ADDRESS / TRAIN_DAYS
          """
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone

          TZ = timezone(timedelta(hours=8))
          ADDR = os.environ.get("ADDRESS", "拱墅区之江一号公寓西北门")
          TRAIN = {int(x) for x in os.environ.get("TRAIN_DAYS", "0,1,3,4").split(",") if x.strip()}

          LUNCH = """
          麻辣烫/冒菜|520|清汤或番茄锅底；鸡胸 150g、虾滑、鹌鹑蛋、魔芋结、金针菇、娃娃菜；主食选一根玉米|不要麻酱和油碟、炸腐皮、宽粉、脆皮肠，汤别喝|蛋白给得最足的一档
          快餐盒饭/盖浇饭|540|米饭减半；白切鸡、豉汁蒸排骨或卤鸡腿去皮；加一份烫青菜|避开糖醋、红烧、干锅、油淋，菜和饭分开放|最容易点到，闭眼执行
          兰州拉面/面馆|550|清汤牛肉面，面少一半，牛肉加钱加量；加一份凉拌黄瓜|不要炒面、油泼面、油泼辣子，不要加面|跟店家说一句就行
          潮汕牛肉火锅|530|清汤锅底；吊龙、匙柄、嫩肉各半份；蔬菜拼盘；少量河粉|沙茶酱只蘸一点，不要炸腐皮和丸子|肉最干净的一餐
          轻食沙拉|480|鸡胸或牛肉底座；藜麦或糙米；油醋汁单独放、自己淋三分之一；加一颗溏心蛋|不要千岛酱、凯撒酱、蛋黄酱、培根碎、油炸天妇罗|热量最低，但别连着吃两天
          日料|500|刺身一份；盐烤鸡串 2 串；茶碗蒸；寿司控制在 6 贯以内|不要天妇罗、炸猪排、照烧和蒲烧类|外食里最不容易超的一类
          沙县小吃|520|蒸饺一份；炖罐汤（排骨或鸡腿）；烫青菜；鸡腿饭记得去皮、饭减半|不要拌面、炒饭、炒粉、卤味拼盘|便宜且好控
          韩餐|560|烤五花肉烤到焦脆、用生菜包着吃；嫩豆腐汤不加芝士；拌饭只吃半碗|不要炸鸡、芝士排骨、部队锅里的泡面|生菜包肉这招能省掉一半油
          粉面/米粉|500|清汤牛肉粉，粉减半；加青菜和一个卤蛋|不要卤粉、酸辣粉，不加肥肠和油渣|汤只喝几口尝味
          便利店|450|关东煮（萝卜、海带、魔芋、鸡蛋、豆腐）；鸡胸肉一包；蔬菜沙拉；无糖茶|不要肉包、粽子、饭团、火腿肠|赶时间的时候用
          """

          DINNER = """
          清蒸鱼+蔬菜|430|清蒸鲈鱼或黄鱼一条；杂粮饭半碗；白灼菜心|不要红烧、干烧、糖醋，汤汁别泡饭|晚上主食半碗是上限
          豆腐虾滑锅|400|嫩豆腐 200g、虾滑 100g、菌菇汤；配少量玉米|不要麻酱蘸料，汤别喝太咸的|自己下锅煮，最省事
          卤牛肉+沙拉|410|牛腱或酱牛肉 120g；大份蔬菜沙拉用油醋汁；半根玉米|酱汁别浇在肉上；不要沙拉酱和面包丁|蛋白质管够，碳水很低
          鸡胸便当|420|鸡胸肉便当，让店家把米饭换成双份青菜；加一个水煮蛋|不要照烧汁、炸物配菜、甜口小菜|下单备注一句就能改
          番茄鸡蛋+荞麦面|430|番茄炒蛋少油两个蛋；荞麦面半份；一份青菜|要求少油、控制在 5g 以内；不要加糖|家常口味，不容易吃腻
          潮汕牛肉火锅（清汤）|420|瘦肉两盘（吊龙、嫩肉）；蔬菜拼盘；豆腐|晚上不碰河粉和主食；沙茶酱只蘸一点|能吃很饱但热量不高
          日料（无主食版）|370|刺身一份；味付海带；茶碗蒸；味增汤|晚上把寿司砍掉，味增汤别喝到底|最轻的一档
          炖汤+白灼虾|390|瓦罐炖汤一份；白灼虾 150g；凉拌木耳菠菜|汤别太咸，虾别蘸油碟|暖胃，适合天冷
          烤鱼|440|清江鱼或鲈鱼一条；烤金针菇；烤韭菜|不要五花肉、烤面筋刷酱、烤馒头片|让店家少刷油
          沙拉+卤牛肉|400|蔬菜沙拉用油醋汁；卤牛肉 100g；水煮蛋 2 个；无糖酸奶|不要千岛酱、培根碎、果干|完全不用等配送的一档
          """


          def parse(text):
              out = []
              for line in text.strip().split("\n"):
                  line = line.strip()
                  if not line:
                      continue
                  c, k, o, d, t = line.split("|")
                  out.append((c, int(k), o.split("；"), d, t))
              return out


          L, D = parse(LUNCH), parse(DINNER)
          meal = os.environ.get("MEAL", "dinner")
          now = datetime.now(TZ)
          day = now.date()
          pool = L if meal == "lunch" else D
          n = int(datetime(day.year, day.month, day.day, tzinfo=TZ).timestamp() // 86400) % 10
          c, k, o, d, t = pool[n]
          h, mi = (11, 30) if meal == "lunch" else (17, 10)
          delta = int((now.replace(hour=h, minute=mi, second=0, microsecond=0) - now).total_seconds() // 60)
          trained = day.weekday() in TRAIN
          kcal = k + (40 if trained else 0)

          if delta >= 0:
              head = "现在 %s，距 %02d:%02d 送达还有 %d 分钟，来得及。" % (now.strftime("%H:%M"), h, mi, delta)
          elif -delta <= 120:
              head = "已过 %02d:%02d 送达点，现在下单大约 %d 分钟后到。" % (h, mi, 30 - delta)
          else:
              head = "已过 %02d:%02d 送达点 %.1f 小时，这一餐已经赶不上了。" % (h, mi, -delta / 60.0)

          lines = ["> " + head, "", "**第 %d 档 · %s**" % (n + 1, c), ""]
          if trained:
              lines += ["_按课表今天是训练日，蛋白往上加一档。_", ""]
          lines.append("## 点这些")
          for x in o:
              lines.append("- " + x)
          if trained:
              lines.append("- 蛋白加量：肉/虾 加到 150g，或额外补一个水煮蛋")
          lines += ["", "## 别要", "- " + d]
          lines += ["", "## 备注栏照抄", "不要米饭、酱汁单独放。饮料换无糖茶或水。"]
          lines += ["", "## 热量", "约 **%d kcal**。" % kcal]
          if meal == "dinner":
              lines += ["", "主食砍掉或减到最少，蔬菜加量，饿就补蛋白不补碳水。"]
          lines += ["", "---", "", "**重点**：%s" % t, "", "配送：" + ADDR]
          body = "\n".join(lines)
          title = "%s点单 · %d/%d 周%s" % (
              "午餐" if meal == "lunch" else "晚餐", day.month, day.day, "一二三四五六日"[day.weekday()])

          print(title)
          print(body)

          key = os.environ.get("SENDKEY", "").strip()
          if not key:
              print("[推送] 未配置 SENDKEY，跳过（内容已打印在上面）")
          else:
              data = urllib.parse.urlencode({"title": title, "desp": body}).encode("utf-8")
              req = urllib.request.Request(
                  "https://sctapi.ftqq.com/%s.send" % key, data=data,
                  headers={"Content-Type": "application/x-www-form-urlencoded"}, method="POST")
              try:
                  res = urllib.request.urlopen(req, timeout=20).read().decode("utf-8", "replace")
                  print("[推送] " + ("成功" if "SUCCESS" in res else "返回异常：%s" % res))
              except Exception as e:
                  print("[推送] 失败：%s" % e)
          PYEOF

      - name: 记录运行时间（防止仓库 60 天无活动被暂停）
        if: always()
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-run.txt
          git commit -m "chore: keep-alive $(date -u +%Y-%m-%d)" || echo "无变更"
          git push || echo "推送跳过"
