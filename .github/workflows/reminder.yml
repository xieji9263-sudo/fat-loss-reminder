                       ("徽衢大院·农家土菜·烤鱼(沈半路店)", "沈半路122号善贤人家", 532),
                       ("郭氏烤鱼", "沈半路150号一幢109室", 547),
                       ("金夜烧烤餐厅", "沈半路150号-101", 552),
                       ("重庆鸡公煲纸包鱼·烤鱼(舟山东路店)", "舟山东路198号宸创大厦一楼1201室", 840),
                       ("郑当家烧烤·烤鱼·龙虾(杭州首店)", "舟山东路198号宸创大厦一层113室", 874)],
          }

          CAP_NEAR = 6      # 单品类时：1km 内最多列几家
          CAP_FAR = 6       # 单品类时：1-2.5km 最多列几家
          CAP_NEAR_M = 4    # 多品类时：每个品类在 1km 内最多列几家
          CAP_FAR_M = 3     # 多品类时：每个品类在 1-2.5km 最多列几家


          def parse(text):
              out = []
              for line in text.strip().split("\n"):
                  line = line.strip()
                  if not line:
                      continue
                  c, k, kw, o, d, t = line.split("|")
                  out.append((c, int(k), kw, o.split("；"), d, t))
              return out


          def nearby(word):
              """腾讯位置服务周边搜索。radius 上限 1000 米（官方限制），返回 [(店名, 地址, 距离米)]。"""
              key = os.environ.get("TENCENT_MAP_KEY", "").strip()
              if not key or not word:
                  return []
              url = "https://apis.map.qq.com/ws/place/v1/search?" + urllib.parse.urlencode({
                  "boundary": "nearby(%s,1000)" % GEO,
                  "keyword": word,
                  "key": key,
                  "page_size": 20,
                  "orderby": "_distance",
              })
              try:
                  with urllib.request.urlopen(url, timeout=20) as resp:
                      data = json.loads(resp.read().decode("utf-8", "replace"))
              except Exception as e:
                  print("[周边] 请求失败：%s" % e)
                  return []
              if data.get("status") != 0:
                  print("[周边] 接口异常：status=%s message=%s" % (data.get("status"), data.get("message")))
                  return []
              out = []
              for it in data.get("data", []):
                  dist = it.get("_distance")
                  if dist is None:
                      continue
                  out.append((it.get("title", ""), it.get("address", ""), int(dist)))
                  if len(out) >= 8:
                      break
              return out


          L, D = parse(LUNCH), parse(DINNER)
          meal = os.environ.get("MEAL", "dinner")
          now = datetime.now(TZ)
          day = now.date()
          pool = L if meal == "lunch" else D
          n = int(datetime(day.year, day.month, day.day, tzinfo=TZ).timestamp() // 86400) % 10
          if os.environ.get("SLOT", "").strip():          # 手动指定档位，用于测试和「换一个」
              n = int(os.environ["SLOT"]) % 10
          c, k, kw, o, d, t = pool[n]
          h, mi = (11, 30) if meal == "lunch" else (17, 10)
          delta = int((now.replace(hour=h, minute=mi, second=0, microsecond=0) - now).total_seconds() // 60)
          trained = day.weekday() in TRAIN
          kcal = k + (40 if trained else 0)

          if delta >= 0:
              head = "现在 %s，距 %02d:%02d 送达还有 %d 分钟，来得及。" % (now.strftime("%H:%M"), h, mi, delta)
          elif -delta <= 120:
              head = "已过 %02d:%02d 送达点 %d 分钟，现在下单大约 30 分钟后到。" % (h, mi, -delta)
          else:
              head = "已过 %02d:%02d 送达点 %.1f 小时，这一餐已经赶不上了。" % (h, mi, -delta / 60.0)

          lines = ["> " + head, "", "**第 %d 档 · %s**" % (n + 1, c), ""]
          if trained:
              lines += ["_按课表今天是训练日，蛋白往上加一档。_", ""]
          lines.append("## 点这些")
          for x in o:
              lines.append("- " + x)
          if trained:
              lines.append("- 蛋白加量：肉/虾 加到 150g，或额外补一个水煮蛋")
          lines += ["", "## 别要", "- " + d]
          lines += ["", "## 备注栏照抄", "不要米饭、酱汁单独放。饮料换无糖茶或水。"]
          lines += ["", "## 热量", "约 **%d kcal**。" % kcal]
          if meal == "dinner":
              lines += ["", "主食砍掉或减到最少，蔬菜加量，饿就补蛋白不补碳水。"]

          # ---- 周边店铺：按关键词分组，每组优先实时搜索，不够 3 家时用预存表补齐 ----
          # 每组先各取满限额，再按「品类顺序 + 距离」排；避免长名单品类把短名单品类挤没。
          words = [w for w in kw.split("/") if w]
          multi = len(words) > 1
          gcap_near = CAP_NEAR_M if multi else CAP_NEAR
          gcap_far = CAP_FAR_M if multi else CAP_FAR

          near, far, miss, taken = [], [], [], set()
          for gi, w in enumerate(words):
              live = nearby(w)
              if live:
                  rows = live + [r for r in SHOPS.get(w, []) if r[0] not in {x[0] for x in live}]
              else:
                  rows = SHOPS.get(w, [])
              if not rows:
                  miss.append(w)
                  continue
              got_n = got_f = 0
              for name, addr, dist in sorted(rows, key=lambda r: r[2]):
                  if name in taken:
                      continue
                  if dist <= 1000:
                      if got_n >= gcap_near:
                          continue
                      got_n += 1
                      near.append((gi, w, dist, name, addr))
                  else:
                      if got_f >= gcap_far:
                          continue
                      got_f += 1
                      far.append((gi, w, dist, name, addr))
                  taken.add(name)

          near.sort(key=lambda r: (r[0], r[2]))
          far.sort(key=lambda r: (r[0], r[2]))

          if near:
              lines += ["", "## 附近 1km 内 · 出餐+配送 25 分钟稳"]
              for gi, w, dist, name, addr in near:
                  lines.append("- %s%s · %dm · %s" % ("[%s] " % w if multi else "", name, dist, addr))
          if far:
              lines += ["", "## 1–2.5km 备选 · 得提前点"]
              for gi, w, dist, name, addr in far:
                  lines.append("- %s%s · %dm · %s" % ("[%s] " % w if multi else "", name, dist, addr))
          if miss:
              lines += ["", "- 「%s」1km 内没搜到对口店，外卖 App 直接搜这个类目。" % "、".join(miss)]
          if near or far:
              lines += ["", "_熟食店和农贸市场摊位不一定上外卖平台，先搜店名确认。_"]

          lines += ["", "---", "", "**重点**：%s" % t, "", "配送：" + ADDR]
          body = "\n".join(lines)
          title = "%s点单 · %d/%d 周%s" % (
              "午餐" if meal == "lunch" else "晚餐", day.month, day.day, "一二三四五六日"[day.weekday()])

          print(title)
          print(body)

          key = os.environ.get("SENDKEY", "").strip()
          if not key:
              print("[推送] 未配置 SENDKEY，跳过（内容已打印在上面）")
          else:
              data = urllib.parse.urlencode({"title": title, "desp": body}).encode("utf-8")
              req = urllib.request.Request(
                  "https://sctapi.ftqq.com/%s.send" % key, data=data,
                  headers={"Content-Type": "application/x-www-form-urlencoded"}, method="POST")
              try:
                  res = urllib.request.urlopen(req, timeout=20).read().decode("utf-8", "replace")
                  print("[推送] " + ("成功" if "SUCCESS" in res else "返回异常：%s" % res))
              except Exception as e:
                  print("[推送] 失败：%s" % e)
          PYEOF

      - name: 记录运行时间（防止仓库 60 天无活动被暂停）
        if: always()
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-run.txt
          git commit -m "chore: keep-alive $(date -u +%Y-%m-%d)" || echo "无变更"
          git push || echo "推送跳过"
